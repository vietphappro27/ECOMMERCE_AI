<!DOCTYPE html>
{% load static %}
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - NovaShop</title>
    <link rel="stylesheet" href="{% static 'css/nova.css' %}">
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="topbar-inner">
                <a class="brand" href="/ui/customer/"><strong>NovaShop</strong><span>Product detail</span></a>
                <nav class="nav">
                    <a href="/ui/customer/">Sản phẩm</a>
                    <a href="/ui/customer/cart/">Giỏ hàng</a>
                    <a href="/ui/customer/orders/">Đơn hàng</a>
                    <a href="/ui/logout/">Đăng xuất</a>
                </nav>
            </div>
        </header>

        <main class="page">
            <div id="notice" class="notice"></div>
            <section class="detail-layout">
                <div class="large-media" id="productMedia">P</div>
                <div class="panel">
                    <p class="eyebrow" id="productCategory">Sản phẩm</p>
                    <h1 id="productName">Đang tải...</h1>
                    <p id="productDescription" class="muted"></p>
                    <p class="price" id="productPrice">0 ₫</p>
                    <p><span id="stockBadge" class="badge">Đang kiểm tra kho</span></p>
                    <p class="muted" id="ratingSummary">Chưa có đánh giá</p>

                    <div class="form-row">
                        <label>Số lượng</label>
                        <div class="qty">
                            <button onclick="changeQty(-1)">-</button>
                            <input id="quantity" value="1" readonly>
                            <button onclick="changeQty(1)">+</button>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-primary" onclick="addToCart()">Thêm vào giỏ</button>
                        <a class="btn" href="/ui/customer/">Quay lại</a>
                    </div>
                </div>
            </section>

            <section class="layout-2" style="margin-top: 18px;">
                <div class="panel">
                    <h2>Đánh giá sản phẩm</h2>
                    <div class="form-grid">
                        <div class="form-row">
                            <label for="ratingScore">Số sao</label>
                            <select id="ratingScore" class="select">
                                <option value="5">5 sao</option>
                                <option value="4">4 sao</option>
                                <option value="3">3 sao</option>
                                <option value="2">2 sao</option>
                                <option value="1">1 sao</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>&nbsp;</label>
                            <button class="btn btn-primary" style="width: 100%;" onclick="submitRating()">Lưu đánh giá</button>
                        </div>
                    </div>
                    <textarea id="ratingReview" class="textarea" placeholder="Nhận xét ngắn về sản phẩm"></textarea>
                </div>
                <div class="panel">
                    <h2>Thông tin kỹ thuật</h2>
                    <div id="detailsBox" class="muted">Chưa có dữ liệu chi tiết.</div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const API_BASE = '/api';
        const productId = Number('{{ product_id|default:"0" }}') || 0;
        const customerId = Number('{{ user_id|default:"0" }}') || 0;
        let product = null;

        const money = (value) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(Number(value || 0));
        const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

        function showNotice(message, type = 'ok') {
            const el = document.getElementById('notice');
            el.textContent = message;
            el.className = `notice ${type} show`;
            setTimeout(() => el.className = 'notice', 3500);
        }

        function categoryOf(item) {
            return item.category || item.category_name || item.item_type || 'Khác';
        }

        function descriptionOf(item) {
            const details = detailsOf(item);
            return item.description || (Object.keys(details).length ? Object.entries(details).map(([k, v]) => `${k}: ${v}`).join(', ') : 'Chưa có mô tả');
        }

        function detailsOf(item) {
            if (item.details && typeof item.details === 'object') return item.details;
            if (item.product_details && typeof item.product_details === 'object') return item.product_details;
            return {};
        }

        async function loadProduct() {
            try {
                const res = await fetch(`${API_BASE}/products/${productId}/`);
                product = await res.json();
                if (!res.ok) throw new Error(product.error || 'not found');
                renderProduct();
                loadRating();
                fetch(`${API_BASE}/customer/activities/`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ customer_id: customerId, product_id: productId, action: 'click' })
                }).catch(() => {});
            } catch (error) {
                showNotice('Không tải được sản phẩm.', 'bad');
            }
        }

        function renderProduct() {
            document.getElementById('productName').textContent = product.name || `Sản phẩm #${productId}`;
            document.getElementById('productCategory').textContent = categoryOf(product);
            document.getElementById('productDescription').textContent = descriptionOf(product);
            document.getElementById('productPrice').textContent = money(product.price);

            const media = document.getElementById('productMedia');
            media.innerHTML = product.image ? `<img src="${esc(product.image)}" alt="${esc(product.name)}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">` : esc((product.name || 'P').slice(0, 1).toUpperCase());

            const stock = Number(product.stock || 0);
            const badge = document.getElementById('stockBadge');
            badge.className = `badge ${stock > 10 ? 'badge-ok' : stock > 0 ? 'badge-warn' : 'badge-bad'}`;
            badge.textContent = stock > 0 ? `${stock} sản phẩm trong kho` : 'Hết hàng';

            const details = detailsOf(product);
            document.getElementById('detailsBox').innerHTML = Object.keys(details).length
                ? Object.entries(details).map(([k, v]) => `<p><strong>${esc(k)}</strong>: ${esc(v)}</p>`).join('')
                : 'Chưa có dữ liệu chi tiết.';
        }

        async function loadRating() {
            try {
                const res = await fetch(`${API_BASE}/customer/ratings/?customer_id=${customerId}&item_type=product&item_id=${productId}`);
                const payload = await res.json();
                document.getElementById('ratingSummary').textContent = `${payload.average_score || 0}/5 từ ${payload.votes || 0} lượt đánh giá. Đánh giá của bạn: ${payload.my_score || 'chưa có'}.`;
                if (payload.my_score) document.getElementById('ratingScore').value = String(payload.my_score);
            } catch (error) {
                document.getElementById('ratingSummary').textContent = 'Rating service chưa sẵn sàng.';
            }
        }

        function changeQty(delta) {
            const input = document.getElementById('quantity');
            input.value = Math.max(1, Number(input.value || 1) + delta);
        }

        async function addToCart() {
            try {
                const res = await fetch(`${API_BASE}/customer/cart-items/`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ customer_id: customerId, product_id: productId, quantity: Number(document.getElementById('quantity').value || 1) })
                });
                if (!res.ok) throw new Error('add failed');
                showNotice('Đã thêm sản phẩm vào giỏ hàng.');
            } catch (error) {
                showNotice('Không thể thêm vào giỏ hàng.', 'bad');
            }
        }

        async function submitRating() {
            try {
                const res = await fetch(`${API_BASE}/customer/ratings/`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        customer_id: customerId,
                        item_type: 'product',
                        item_id: productId,
                        score: Number(document.getElementById('ratingScore').value),
                        review: document.getElementById('ratingReview').value
                    })
                });
                const payload = await res.json();
                if (!res.ok) throw new Error(payload.error || 'rating failed');
                showNotice('Đã lưu đánh giá.');
                loadRating();
            } catch (error) {
                showNotice(error.message || 'Không thể lưu đánh giá.', 'bad');
            }
        }

        window.addEventListener('load', loadProduct);
    </script>
</body>
</html>
