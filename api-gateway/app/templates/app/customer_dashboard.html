<!doctype html>
{% load static %}
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khách hàng - NovaShop</title>
    <link rel="stylesheet" href="{% static 'css/nova.css' %}" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="/ui/customer/"
            ><strong>NovaShop</strong><span>Customer workspace</span></a
          >
          <nav class="nav">
            <a class="active" href="/ui/customer/">Sản phẩm</a>
            <a href="/ui/customer/cart/">Giỏ hàng</a>
            <a href="/ui/customer/orders/">Đơn hàng</a>
            <a href="/ui/logout/">Đăng xuất</a>
          </nav>
        </div>
      </header>

      <main class="page">
        <section class="hero">
          <div class="hero-main">
            <p class="eyebrow">Xin chào {{ full_name|default:username }}</p>
            <!-- <h1>Mua sắm và nhận gợi ý sản phẩm phù hợp với bạn.</h1>
            <p class="muted">
              Tìm kiếm, xem chi tiết, thêm giỏ hàng và thanh toán trực tiếp qua
              hệ thống API thật.
            </p> -->
          </div>
        </section>

        <div id="notice" class="notice"></div>

        <section class="panel">
          <h2>Tìm sản phẩm</h2>
          <div class="toolbar">
            <input
              id="searchInput"
              class="input"
              type="search"
              placeholder="Nhập tên sản phẩm hoặc mô tả"
            />
            <select id="categorySelect" class="select">
              <option value="">Tất cả danh mục</option>
            </select>
            <button class="btn btn-primary" onclick="applyFilters()">
              Tìm
            </button>
          </div>
          <div id="productsGrid" class="grid">
            <div class="empty">Đang tải sản phẩm...</div>
          </div>
        </section>

        <section class="panel" style="margin-top: 18px">
          <h2>Gợi ý AI</h2>
          <div id="recommendations" class="grid">
            <div class="empty">Đang tải gợi ý phù hợp...</div>
          </div>
        </section>
      </main>

      <button
        class="chat-fab"
        type="button"
        onclick="toggleChat()"
        aria-label="Mở chatbot"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M21 11.5a8.5 8.5 0 0 1-9.6 8.4 8.7 8.7 0 0 1-3.2-1.1L3 20l1.2-4.4A8.5 8.5 0 1 1 21 11.5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path
            d="M8 10h8M8 14h5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <aside id="chatBox" class="chat-box" aria-live="polite">
        <div class="chat-head">
          <div>
            <strong>NovaBot</strong>
            <span>Gợi ý sản phẩm theo nhu cầu</span>
          </div>
          <button
            type="button"
            onclick="toggleChat()"
            aria-label="Đóng chatbot"
          >
            ×
          </button>
        </div>
        <div id="chatMessages" class="chat-messages">
          <div class="chat-bubble bot">Bạn cần tìm sản phẩm nào?</div>
        </div>
        <div class="chat-compose">
          <input
            id="chatMessage"
            class="input"
            placeholder="Ví dụ: Tôi muốn laptop dưới 15 triệu"
          />
          <button class="btn btn-primary" onclick="sendChat()">Gửi</button>
        </div>
      </aside>
    </div>

    <script>
      const API_BASE = "/api";
      const customerId = Number('{{ user_id|default:"0" }}') || 0;
      let allProducts = [];

      const money = (value) =>
        new Intl.NumberFormat("vi-VN", {
          style: "currency",
          currency: "VND",
        }).format(Number(value || 0));
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c],
        );

      function showNotice(message, type = "ok") {
        const el = document.getElementById("notice");
        el.textContent = message;
        el.className = `notice ${type} show`;
        setTimeout(() => (el.className = "notice"), 3500);
      }

      function normalizeProducts(payload) {
        if (Array.isArray(payload)) return payload;
        if (Array.isArray(payload.results)) return payload.results;
        if (Array.isArray(payload.data)) return payload.data;
        if (Array.isArray(payload.items)) return payload.items;
        return [];
      }

      function productCategory(product) {
        return (
          product.category_name ||
          product.item_type ||
          product.category ||
          "Khác"
        );
      }

      function productDescription(product) {
        if (product.description) return product.description;
        if (product.details && typeof product.details === "object")
          return Object.entries(product.details)
            .map(([k, v]) => `${k}: ${v}`)
            .join(", ");
        if (
          product.product_details &&
          typeof product.product_details === "object"
        )
          return Object.entries(product.product_details)
            .map(([k, v]) => `${k}: ${v}`)
            .join(", ");
        return "Chưa có mô tả";
      }

      function productId(product) {
        return Number(product.id || product.product_id || product.item_id || 0);
      }

      function productImage(product) {
        const id = productId(product);
        const matched = id
          ? allProducts.find((p) => productId(p) === id)
          : null;
        return product.image || product.product_image || matched?.image || "";
      }

      function productStock(product) {
        const id = productId(product);
        const matched = id
          ? allProducts.find((p) => productId(p) === id)
          : null;
        return Number(product.stock ?? matched?.stock ?? 0);
      }

      function productPrice(product) {
        const id = productId(product);
        const matched = id
          ? allProducts.find((p) => productId(p) === id)
          : null;
        return Number(product.price ?? matched?.price ?? 0);
      }

      async function loadProducts() {
        try {
          const res = await fetch(`${API_BASE}/products/`);
          const payload = await res.json();
          allProducts = normalizeProducts(payload);
          renderCategories();
          renderProducts(allProducts);
        } catch (error) {
          document.getElementById("productsGrid").innerHTML =
            '<div class="empty">Không tải được sản phẩm.</div>';
          showNotice("Không thể kết nối API sản phẩm.", "bad");
        }
      }

      function renderCategories() {
        const select = document.getElementById("categorySelect");
        const current = select.value;
        const categories = [
          ...new Set(allProducts.map(productCategory).filter(Boolean)),
        ].sort();
        select.innerHTML =
          '<option value="">Tất cả danh mục</option>' +
          categories
            .map((cat) => `<option value="${esc(cat)}">${esc(cat)}</option>`)
            .join("");
        select.value = current;
      }

      function renderProducts(products) {
        const grid = document.getElementById("productsGrid");
        if (!products.length) {
          grid.innerHTML =
            '<div class="empty">Không có sản phẩm phù hợp.</div>';
          return;
        }
        grid.innerHTML = products
          .map((p) => {
            const stock = Number(p.stock || 0);
            const stockClass =
              stock > 10 ? "badge-ok" : stock > 0 ? "badge-warn" : "badge-bad";
            return `
                    <article class="card">
                        <div class="product-media">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}">` : esc((p.name || "P").slice(0, 1).toUpperCase())}</div>
                        <div class="card-body">
                            <h3 class="card-title">${esc(p.name || `Sản phẩm #${p.id}`)}</h3>
                            <p class="muted">${esc(productCategory(p))}</p>
                            <p class="price">${money(p.price)}</p>
                            <p class="muted">${esc(productDescription(p))}</p>
                            <span class="badge ${stockClass}">${stock > 0 ? `${stock} trong kho` : "Hết hàng"}</span>
                            <div class="actions">
                                <button class="btn btn-small" onclick="viewProduct(${Number(p.id)})">Chi tiết</button>
                                <button class="btn btn-primary btn-small" ${stock <= 0 ? "disabled" : ""} onclick="addToCart(${Number(p.id)})">Thêm giỏ</button>
                            </div>
                        </div>
                    </article>
                `;
          })
          .join("");
      }

      function applyFilters() {
        const q = document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();
        const cat = document.getElementById("categorySelect").value;
        const filtered = allProducts.filter((p) => {
          const text = `${p.name || ""} ${productDescription(p)}`.toLowerCase();
          return (
            (!q || text.includes(q)) && (!cat || productCategory(p) === cat)
          );
        });
        renderProducts(filtered);
        if (q)
          fetch(
            `${API_BASE}/customer/search/?q=${encodeURIComponent(q)}&customer_id=${customerId}`,
          ).catch(() => {});
      }

      function viewProduct(productId) {
        if (!productId) return;
        fetch(`${API_BASE}/customer/activities/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            customer_id: customerId,
            product_id: productId,
            action: "click",
          }),
        }).catch(() => {});
        window.location.href = `/ui/customer/product/${productId}/`;
      }

      async function addToCart(productId) {
        try {
          const res = await fetch(`${API_BASE}/customer/cart-items/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              customer_id: customerId,
              product_id: productId,
              quantity: 1,
            }),
          });
          if (!res.ok) throw new Error("add failed");
          showNotice("Đã thêm sản phẩm vào giỏ hàng.");
        } catch (error) {
          showNotice("Không thể thêm sản phẩm vào giỏ hàng.", "bad");
        }
      }

      async function loadRecommendations() {
        const box = document.getElementById("recommendations");
        box.innerHTML = '<div class="empty">Đang tải gợi ý...</div>';
        try {
          const res = await fetch(
            `${API_BASE}/ai/recommendations/${customerId}/?limit=6`,
          );
          const payload = await res.json();
          const items = normalizeProducts(
            payload.recommendations || payload.products || payload,
          );
          renderRecommendations(items);
        } catch (error) {
          box.innerHTML = '<div class="empty">AI service chưa sẵn sàng.</div>';
        }
      }

      function renderRecommendations(items) {
        const box = document.getElementById("recommendations");
        if (!items.length) {
          box.innerHTML =
            '<div class="empty">Chưa có gợi ý cho tài khoản này.</div>';
          return;
        }
        box.innerHTML = items
          .slice(0, 6)
          .map((item) => {
            const id = productId(item);
            const name =
              item.name ||
              item.product_name ||
              `Sản phẩm #${item.product_id || item.id}`;
            const image = productImage(item);
            const stock = productStock(item);
            const price = productPrice(item);
            const stockClass =
              stock > 10 ? "badge-ok" : stock > 0 ? "badge-warn" : "badge-bad";
            return `
                    <article class="card">
                        <div class="product-media">${image ? `<img src="${esc(image)}" alt="${esc(name)}">` : esc((name || "G").slice(0, 1).toUpperCase())}</div>
                        <div class="card-body">
                            <h3 class="card-title">${esc(name)}</h3>
                            <p class="muted">${esc(item.reason || item.category_name || item.category || "")}</p>
                            <p class="price">${money(price)}</p>
                            <span class="badge ${stockClass}">${stock > 0 ? `${stock} trong kho` : "Hết hàng"}</span>
                            <div class="actions">
                                <button class="btn btn-small" ${!id ? "disabled" : ""} onclick="viewProduct(${id})">Chi tiết</button>
                                <button class="btn btn-primary btn-small" ${!id || stock <= 0 ? "disabled" : ""} onclick="addToCart(${id})">Thêm giỏ</button>
                            </div>
                        </div>
                    </article>
                `;
          })
          .join("");
      }

      function toggleChat() {
        document.getElementById("chatBox").classList.toggle("open");
      }

      function appendChat(text, role) {
        const messages = document.getElementById("chatMessages");
        const bubble = document.createElement("div");
        bubble.className = `chat-bubble ${role}`;
        bubble.textContent = text;
        messages.appendChild(bubble);
        messages.scrollTop = messages.scrollHeight;
      }

      async function sendChat() {
        const message = document.getElementById("chatMessage").value.trim();
        if (!message) return;
        document.getElementById("chatMessage").value = "";
        appendChat(message, "user");
        appendChat("Đang hỏi AI...", "bot pending");
        try {
          const res = await fetch(`${API_BASE}/ai/chat/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, customer_id: customerId }),
          });
          const payload = await res.json();
          const pending = document.querySelector(".chat-bubble.pending");
          if (pending) pending.remove();
          appendChat(
            payload.answer ||
              payload.response ||
              payload.message ||
              "AI đã phản hồi nhưng không có nội dung hiển thị.",
            "bot",
          );
        } catch (error) {
          const pending = document.querySelector(".chat-bubble.pending");
          if (pending) pending.remove();
          appendChat("AI service chưa sẵn sàng.", "bot");
        }
      }

      document
        .getElementById("searchInput")
        .addEventListener("keydown", (event) => {
          if (event.key === "Enter") applyFilters();
        });
      document
        .getElementById("chatMessage")
        .addEventListener("keydown", (event) => {
          if (event.key === "Enter") sendChat();
        });
      document
        .getElementById("categorySelect")
        .addEventListener("change", applyFilters);
      window.addEventListener("load", async () => {
        await loadProducts();
        await loadRecommendations();
      });
    </script>
  </body>
</html>
