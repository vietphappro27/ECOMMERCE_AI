<!doctype html>
{% load static %}
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - PhapShop</title>
    <link rel="stylesheet" href="{% static 'css/nova.css' %}" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .auth-page {
        width: 100%;
        max-width: 1100px;
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        overflow: hidden;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }

      .auth-intro {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 12px;
        opacity: 0.8;
        margin-bottom: 12px;
      }

      .auth-intro h1 {
        font-size: 42px;
        line-height: 1.2;
        margin-bottom: 20px;
      }

      .auth-intro p {
        line-height: 1.7;
        opacity: 0.95;
      }

      .stats {
        display: flex;
        gap: 16px;
        margin-top: 32px;
      }

      .stat {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 16px 20px;
        min-width: 100px;
      }

      .stat strong {
        display: block;
        font-size: 28px;
        margin-bottom: 6px;
      }

      .auth-card {
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .auth-card h2 {
        margin-bottom: 24px;
        color: #0f172a;
      }

      .form-row {
        margin-bottom: 18px;
      }

      .form-row label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #334155;
      }

      .input,
      .select {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #dbe2ea;
        border-radius: 12px;
        font-size: 15px;
        transition: 0.3s;
      }

      .input:focus,
      .select:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
      }

      .btn {
        border: none;
        cursor: pointer;
        padding: 14px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        transition: 0.3s;
      }

      .btn-primary {
        width: 100%;
        background: #2563eb;
        color: white;
      }

      .btn-primary:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
      }

      .notice {
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 16px;
      }

      .bad {
        background: #fee2e2;
        color: #b91c1c;
      }

      .ok {
        background: #dcfce7;
        color: #166534;
      }

      .muted {
        margin-top: 20px;
        text-align: center;
        color: #64748b;
      }

      .muted a {
        color: #2563eb;
        text-decoration: none;
      }

      .muted a:hover {
        text-decoration: underline;
      }

      @media (max-width: 900px) {
        .auth-page {
          grid-template-columns: 1fr;
        }

        .auth-intro {
          padding: 40px;
        }

        .auth-card {
          padding: 32px;
        }

        .auth-intro h1 {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-intro">
        <!-- <p class="eyebrow">PhapShop Gateway</p> -->

        <h1>Đăng nhập để vận hành hệ thống bán hàng</h1>
      </section>

      <section class="auth-card">
        <p class="eyebrow">Đăng nhập</p>
        <h2>Chào mừng trở lại 👋</h2>

        {% if error %}
        <div class="notice bad">{{ error }}</div>
        {% endif %} {% if info %}
        <div class="notice ok">{{ info }}</div>
        {% endif %}

        <!-- GIỮ NGUYÊN ENDPOINT -->
        <form method="post" action="/ui/login/">
          {% csrf_token %}

          <div class="form-row">
            <label for="username">Tên đăng nhập</label>
            <input
              id="username"
              name="username"
              class="input"
              type="text"
              autocomplete="username"
              required
              autofocus
            />
          </div>

          <div class="form-row">
            <label for="password">Mật khẩu</label>
            <input
              id="password"
              name="password"
              class="input"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="form-row">
            <label for="role">Vai trò</label>
            <select id="role" name="role" class="select" required>
              <option
                value="CUSTOMER"
                {%
                if
                role=""
                ="CUSTOMER"
                %}selected{%
                endif
                %}
              >
                Khách hàng
              </option>

              <option
                value="STAFF"
                {%
                if
                role=""
                ="STAFF"
                %}selected{%
                endif
                %}
              >
                Nhân viên
              </option>
            </select>
          </div>
          <button class="btn btn-primary" type="submit">Đăng nhập</button>
        </form>

        <!-- GIỮ NGUYÊN LINK -->
        <p class="muted">
          Chưa có tài khoản?
          <a href="/ui/register/">
            <strong>Đăng ký tại đây</strong>
          </a>
        </p>
      </section>
    </main>
  </body>
</html>
