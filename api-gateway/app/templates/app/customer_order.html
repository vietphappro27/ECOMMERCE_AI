<!DOCTYPE html>
{% load static %}
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng - NovaShop</title>
    <link rel="stylesheet" href="{% static 'css/nova.css' %}">
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="topbar-inner">
                <a class="brand" href="/ui/customer/"><strong>NovaShop</strong><span>Orders</span></a>
                <nav class="nav">
                    <a href="/ui/customer/">Sản phẩm</a>
                    <a href="/ui/customer/cart/">Giỏ hàng</a>
                    <a class="active" href="/ui/customer/orders/">Đơn hàng</a>
                    <a href="/ui/logout/">Đăng xuất</a>
                </nav>
            </div>
        </header>

        <main class="page">
            <section class="hero-main" style="margin-bottom: 18px;">
                <p class="eyebrow">Lịch sử đơn hàng</p>
                <h1>Theo dõi đơn đã tạo từ giỏ hàng.</h1>
                <p class="muted">Trang này dùng API thật: `/api/orders/?customer_id=<id>` và mua lại qua `/api/customer/cart-items/`.</p>
            </section>

            <div id="notice" class="notice"></div>
            <section class="panel">
                <div class="toolbar">
                    <select id="statusFilter" class="select">
                        <option value="">Tất cả trạng thái</option>
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="shipped">Shipped</option>
                        <option value="delivered">Delivered</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <button class="btn" onclick="loadOrders()">Làm mới</button>
                    <a class="btn btn-primary" href="/ui/customer/">Tiếp tục mua</a>
                </div>
                <div id="ordersContent">
                    <div class="empty">Đang tải đơn hàng...</div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const API_BASE = '/api';
        const customerId = Number('{{ user_id|default:"0" }}') || 0;
        let orders = [];

        const money = (value) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(Number(value || 0));
        const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

        function showNotice(message, type = 'ok') {
            const el = document.getElementById('notice');
            el.textContent = message;
            el.className = `notice ${type} show`;
            setTimeout(() => el.className = 'notice', 3500);
        }

        function normalizeOrders(payload) {
            if (Array.isArray(payload)) return payload;
            if (Array.isArray(payload.orders)) return payload.orders;
            if (Array.isArray(payload.results)) return payload.results;
            if (Array.isArray(payload.data)) return payload.data;
            return [];
        }

        function orderTotal(order) {
            return Number(order.total ?? order.total_amount ?? order.total_price ?? 0);
        }

        async function loadOrders() {
            try {
                const res = await fetch(`${API_BASE}/orders/?customer_id=${customerId}`);
                const payload = await res.json();
                orders = normalizeOrders(payload);
                renderOrders();
            } catch (error) {
                document.getElementById('ordersContent').innerHTML = '<div class="empty">Không tải được đơn hàng.</div>';
                showNotice('Không thể kết nối API đơn hàng.', 'bad');
            }
        }

        function renderOrders() {
            const status = document.getElementById('statusFilter').value;
            const filtered = status ? orders.filter((o) => String(o.status || '').toLowerCase() === status) : orders;
            const box = document.getElementById('ordersContent');
            if (!filtered.length) {
                box.innerHTML = '<div class="empty">Chưa có đơn hàng phù hợp.</div>';
                return;
            }
            box.innerHTML = filtered.map((order) => `
                <article class="card" style="margin-bottom: 14px;">
                    <div class="card-body">
                        <div class="actions" style="justify-content: space-between; margin-top: 0;">
                            <div>
                                <h3>Đơn #${esc(order.id)}</h3>
                                <p class="muted">${esc(order.created_at || '')}</p>
                            </div>
                            <span class="badge">${esc(order.status || 'unknown')}</span>
                        </div>
                        <div class="stats">
                            <div class="stat"><span class="muted">Tổng tiền</span><strong>${money(orderTotal(order))}</strong></div>
                            <div class="stat"><span class="muted">Thanh toán</span><strong>${esc(order.payment_status || 'n/a')}</strong></div>
                            <div class="stat"><span class="muted">Vận chuyển</span><strong>${esc(order.shipping_status || order.delivery_date || 'n/a')}</strong></div>
                        </div>
                        <div class="table-wrap" style="margin-top: 12px;">
                            <table class="table">
                                <thead><tr><th>Sản phẩm</th><th>Số lượng</th><th>Giá</th></tr></thead>
                                <tbody>
                                    ${(order.items || []).map((item) => `
                                        <tr>
                                            <td>${esc(item.name || item.product_name || `#${item.product_id}`)}</td>
                                            <td>${Number(item.quantity || 1)}</td>
                                            <td>${money(item.price || item.unit_price || 0)}</td>
                                        </tr>
                                    `).join('') || '<tr><td colspan="3">Không có chi tiết sản phẩm.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                        <div class="actions">
                            <button class="btn btn-small" onclick="reorder(${Number(order.id)})">Mua lại</button>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        async function reorder(orderId) {
            const order = orders.find((item) => Number(item.id) === Number(orderId));
            if (!order || !Array.isArray(order.items) || !order.items.length) {
                showNotice('Đơn hàng không có sản phẩm để mua lại.', 'bad');
                return;
            }
            try {
                for (const item of order.items) {
                    await fetch(`${API_BASE}/customer/cart-items/`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            customer_id: customerId,
                            product_id: Number(item.product_id || item.item_id),
                            quantity: Number(item.quantity || 1)
                        })
                    });
                }
                showNotice('Đã thêm sản phẩm của đơn cũ vào giỏ hàng.');
            } catch (error) {
                showNotice('Không thể mua lại đơn này.', 'bad');
            }
        }

        document.getElementById('statusFilter').addEventListener('change', renderOrders);
        window.addEventListener('load', loadOrders);
    </script>
</body>
</html>
