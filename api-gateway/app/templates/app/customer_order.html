<!doctype html>
{% load static %}
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đơn hàng - PhapShop</title>
    <link rel="stylesheet" href="{% static 'css/nova.css' %}" />
    <style>
      /* ── Order Page Custom Styles ── */
      :root {
        --shop-blue: #2563eb;
        --shop-gradient: linear-gradient(
          135deg,
          #1e40af 0%,
          #2563eb 50%,
          #0ea5e9 100%
        );
        --card-radius: 14px;
      }

      /* ── Topbar ── */
      .topbar {
        background: var(--shop-gradient) !important;
        border-bottom: none !important;
        backdrop-filter: none !important;
      }
      .brand strong {
        color: #fff;
        font-size: 1.15rem;
        letter-spacing: -0.02em;
      }
      .brand span {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.78rem;
      }
      .nav a {
        color: rgba(255, 255, 255, 0.75) !important;
        border-radius: 8px;
        font-size: 0.88rem;
        transition: background 0.2s;
      }
      .nav a:hover,
      .nav a.active {
        background: rgba(255, 255, 255, 0.18) !important;
        color: #fff !important;
      }
      .nav a.active {
        font-weight: 800;
      }

      /* ── Page ── */
      .page {
        padding-top: 0;
      }

      /* ── Page header ── */
      .order-page-header {
        background: var(--shop-gradient);
        padding: 28px 0 64px;
        position: relative;
        overflow: hidden;
      }
      .order-page-header::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      }
      .order-page-header::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 56px;
        background: var(--bg);
        clip-path: ellipse(55% 100% at 50% 100%);
      }
      .header-inner {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 20px;
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .header-icon {
        width: 52px;
        height: 52px;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        backdrop-filter: blur(8px);
      }
      .header-text h1 {
        color: #fff;
        font-size: 1.6rem;
        margin: 0 0 4px;
        font-weight: 900;
      }
      .header-text p {
        color: rgba(255, 255, 255, 0.72);
        margin: 0;
        font-size: 0.88rem;
      }
      .header-stat {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 12px 20px;
        text-align: center;
        backdrop-filter: blur(8px);
        flex-shrink: 0;
      }
      .header-stat strong {
        display: block;
        color: #fff;
        font-size: 1.8rem;
        font-weight: 900;
        line-height: 1;
      }
      .header-stat span {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.75rem;
        font-weight: 600;
        display: block;
        margin-top: 3px;
      }

      /* ── Main content ── */
      .orders-main {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 20px 60px;
      }

      /* ── Toolbar ── */
      .orders-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }
      .filter-select {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 14px;
        font-size: 0.88rem;
        background: #fff;
        color: var(--text);
        outline: none;
        cursor: pointer;
        min-width: 170px;
        transition: border-color 0.15s;
      }
      .filter-select:focus {
        border-color: var(--shop-blue);
      }
      .btn-refresh-orders {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 10px;
        padding: 9px 16px;
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--muted);
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .btn-refresh-orders:hover {
        background: #f0f4ff;
        border-color: #c7d2fe;
        color: var(--shop-blue);
      }
      .btn-shop-link {
        margin-left: auto;
        background: var(--shop-gradient);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 9px 18px;
        font-size: 0.88rem;
        font-weight: 800;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
        transition: opacity 0.2s;
      }
      .btn-shop-link:hover {
        opacity: 0.9;
      }

      /* ── Order count chip ── */
      .orders-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      .orders-meta h2 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 800;
      }
      .order-count-chip {
        background: #dbeafe;
        color: #1d4ed8;
        border-radius: 999px;
        padding: 3px 12px;
        font-size: 0.78rem;
        font-weight: 700;
      }

      /* ── Order card ── */
      .order-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--card-radius);
        margin-bottom: 16px;
        overflow: hidden;
        box-shadow: 0 1px 6px rgba(22, 32, 51, 0.06);
        transition: box-shadow 0.2s;
      }
      .order-card:hover {
        box-shadow: 0 4px 18px rgba(22, 32, 51, 0.1);
      }

      /* Card header */
      .order-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid #f1f5f9;
        gap: 12px;
        flex-wrap: wrap;
      }
      .order-id-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .order-id-badge {
        background: #f1f5f9;
        color: var(--text);
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 0.82rem;
        font-weight: 800;
      }
      .order-date {
        font-size: 0.8rem;
        color: var(--muted);
      }

      /* Status badges */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: capitalize;
      }
      .status-badge::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .status-pending {
        background: #fef3c7;
        color: #92400e;
      }
      .status-confirmed {
        background: #dbeafe;
        color: #1d4ed8;
      }
      .status-shipped {
        background: #ede9fe;
        color: #6d28d9;
      }
      .status-delivered {
        background: #dcfce7;
        color: #15803d;
      }
      .status-cancelled {
        background: #fee2e2;
        color: #b91c1c;
      }
      .status-unknown {
        background: #f1f5f9;
        color: var(--muted);
      }

      /* Card stats row */
      .order-stats-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-bottom: 1px solid #f1f5f9;
      }
      .order-stat-cell {
        padding: 13px 20px;
        border-right: 1px solid #f1f5f9;
      }
      .order-stat-cell:last-child {
        border-right: none;
      }
      .order-stat-cell .label {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .order-stat-cell .value {
        font-size: 0.95rem;
        font-weight: 800;
        color: var(--text);
      }
      .order-stat-cell .value.price {
        color: var(--shop-blue);
        font-size: 1.05rem;
      }

      /* Payment & shipping chips */
      .pay-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .pay-pending {
        background: #fef3c7;
        color: #92400e;
      }
      .pay-paid {
        background: #dcfce7;
        color: #15803d;
      }
      .pay-failed {
        background: #fee2e2;
        color: #b91c1c;
      }
      .pay-default {
        background: #f1f5f9;
        color: var(--muted);
      }

      /* Items collapsible */
      .order-items-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        cursor: pointer;
        border-bottom: 1px solid #f8fafc;
        transition: background 0.15s;
        user-select: none;
      }
      .order-items-toggle:hover {
        background: #fafbff;
      }
      .toggle-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--text);
      }
      .items-count-chip {
        background: #f1f5f9;
        color: var(--muted);
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 0.72rem;
        font-weight: 700;
      }
      .toggle-arrow {
        font-size: 0.8rem;
        color: var(--muted);
        transition: transform 0.2s;
      }
      .toggle-arrow.open {
        transform: rotate(180deg);
      }

      .order-items-body {
        display: none;
        border-bottom: 1px solid #f1f5f9;
      }
      .order-items-body.open {
        display: block;
      }

      /* Items table */
      .items-table {
        width: 100%;
        border-collapse: collapse;
      }
      .items-table th {
        background: #fafbfc;
        padding: 9px 16px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .items-table td {
        padding: 11px 16px;
        font-size: 0.87rem;
        border-bottom: 1px solid #f8fafc;
        vertical-align: middle;
      }
      .items-table tr:last-child td {
        border-bottom: none;
      }
      .items-table tr:hover td {
        background: #fafbff;
      }
      .item-name {
        font-weight: 700;
        color: var(--text);
      }
      .item-id {
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 2px;
      }
      .item-qty {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
        border-radius: 6px;
        padding: 3px 10px;
        font-weight: 800;
        font-size: 0.85rem;
      }
      .item-price {
        font-weight: 700;
        color: var(--shop-blue);
      }

      /* Card footer */
      .order-card-footer {
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .ship-addr {
        font-size: 0.78rem;
        color: var(--muted);
        display: flex;
        align-items: flex-start;
        gap: 5px;
      }
      .ship-addr span {
        max-width: 360px;
        line-height: 1.4;
      }
      .btn-reorder {
        border: 1px solid #e0e7ff;
        background: #f0f4ff;
        color: #4338ca;
        border-radius: 9px;
        padding: 8px 16px;
        font-size: 0.82rem;
        font-weight: 800;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s;
      }
      .btn-reorder:hover {
        background: #e0e7ff;
      }

      /* ── Empty state ── */
      .orders-empty {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--card-radius);
        padding: 64px 20px;
        text-align: center;
        color: var(--muted);
        box-shadow: 0 1px 6px rgba(22, 32, 51, 0.06);
      }
      .orders-empty .empty-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #dbeafe, #ede9fe);
        display: grid;
        place-items: center;
        font-size: 2rem;
        margin: 0 auto 16px;
      }
      .orders-empty h3 {
        margin: 0 0 6px;
        color: var(--text);
        font-size: 1.1rem;
      }
      .orders-empty p {
        margin: 0 0 20px;
        font-size: 0.88rem;
      }
      .btn-start-shop {
        display: inline-block;
        background: var(--shop-gradient);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 12px 28px;
        font-weight: 800;
        font-size: 0.92rem;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        transition:
          opacity 0.2s,
          transform 0.15s;
      }
      .btn-start-shop:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      /* ── Toast ── */
      .toast {
        display: none;
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 50;
        min-width: 260px;
        max-width: 360px;
        padding: 13px 18px;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 600;
        box-shadow: 0 8px 32px rgba(22, 32, 51, 0.18);
        align-items: center;
        gap: 10px;
      }
      .toast.show {
        display: flex;
        animation: toastIn 0.25s ease;
      }
      .toast.ok {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        color: #15803d;
      }
      .toast.bad {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Responsive ── */
      @media (max-width: 640px) {
        .header-stat {
          display: none;
        }
        .order-stats-row {
          grid-template-columns: 1fr 1fr;
        }
        .order-stats-row .order-stat-cell:last-child {
          grid-column: 1 / -1;
          border-top: 1px solid #f1f5f9;
        }
        .orders-toolbar {
          gap: 8px;
        }
        .btn-shop-link {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <!-- ── Topbar ── -->
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="/ui/customer/">
            <strong>⚡ PhapShop</strong>
            <span>Đơn hàng</span>
          </a>
          <nav class="nav">
            <a href="/ui/customer/">🛍 Sản phẩm</a>
            <a href="/ui/customer/cart/">🛒 Giỏ hàng</a>
            <a class="active" href="/ui/customer/orders/">📦 Đơn hàng</a>
            <a href="/ui/logout/">Đăng xuất</a>
          </nav>
        </div>
      </header>

      <!-- ── Page header ── -->
      <div class="order-page-header">
        <div class="header-inner">
          <div class="header-left">
            <div class="header-icon">📦</div>
            <div class="header-text">
              <h1>Lịch sử đơn hàng</h1>
              <p>Theo dõi trạng thái và chi tiết tất cả đơn đã đặt.</p>
            </div>
          </div>
          <div class="header-stat">
            <strong id="headerOrderCount">—</strong>
            <span>Đơn hàng</span>
          </div>
        </div>
      </div>

      <!-- ── Main content ── -->
      <main class="orders-main">
        <!-- Toolbar -->
        <div class="orders-toolbar">
          <select id="statusFilter" class="filter-select">
            <option value="">📋 Tất cả trạng thái</option>
            <option value="pending">⏳ Pending</option>
            <option value="confirmed">✅ Confirmed</option>
            <option value="shipped">🚚 Shipped</option>
            <option value="delivered">📬 Delivered</option>
            <option value="cancelled">❌ Cancelled</option>
          </select>
          <button class="btn-refresh-orders" onclick="loadOrders()">
            ↻ Làm mới
          </button>
          <a class="btn-shop-link" href="/ui/customer/">🛍 Tiếp tục mua sắm</a>
        </div>

        <!-- Orders meta -->
        <div class="orders-meta">
          <h2>Đơn hàng của bạn</h2>
          <span class="order-count-chip" id="orderCountChip">Đang tải…</span>
        </div>

        <!-- Orders list -->
        <div id="ordersContent">
          <div class="orders-empty">
            <div class="empty-icon">⏳</div>
            <h3>Đang tải đơn hàng…</h3>
          </div>
        </div>
      </main>
    </div>

    <!-- ── Toast ── -->
    <div id="toast" class="toast">
      <span id="toastIcon"></span>
      <span id="toastMsg"></span>
    </div>

    <script>
      const API_BASE = "/api";
      const customerId = Number('{{ user_id|default:"0" }}') || 0;
      let orders = [];

      const money = (v) =>
        new Intl.NumberFormat("vi-VN", {
          style: "currency",
          currency: "VND",
        }).format(Number(v || 0));
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c],
        );

      function showNotice(message, type = "ok") {
        const toast = document.getElementById("toast");
        document.getElementById("toastMsg").textContent = message;
        document.getElementById("toastIcon").textContent =
          type === "ok" ? "✅" : "❌";
        toast.className = `toast ${type} show`;
        clearTimeout(toast._t);
        toast._t = setTimeout(() => {
          toast.className = "toast";
        }, 3200);
      }

      function normalizeOrders(payload) {
        if (Array.isArray(payload)) return payload;
        if (Array.isArray(payload.orders)) return payload.orders;
        if (Array.isArray(payload.results)) return payload.results;
        if (Array.isArray(payload.data)) return payload.data;
        return [];
      }

      function orderTotal(order) {
        return Number(
          order.total ?? order.total_amount ?? order.total_price ?? 0,
        );
      }

      function statusClass(status) {
        const map = {
          pending: "status-pending",
          confirmed: "status-confirmed",
          shipped: "status-shipped",
          delivered: "status-delivered",
          cancelled: "status-cancelled",
        };
        return map[String(status || "").toLowerCase()] || "status-unknown";
      }

      function statusLabel(status) {
        const map = {
          pending: "⏳ Pending",
          confirmed: "✅ Confirmed",
          shipped: "🚚 Shipped",
          delivered: "📬 Delivered",
          cancelled: "❌ Cancelled",
        };
        return (
          map[String(status || "").toLowerCase()] || esc(status || "unknown")
        );
      }

      function payChipClass(payStatus) {
        const s = String(payStatus || "").toLowerCase();
        if (s === "paid") return "pay-paid";
        if (s === "failed") return "pay-failed";
        if (s === "pending") return "pay-pending";
        return "pay-default";
      }

      function formatDate(raw) {
        if (!raw) return "N/A";
        const d = new Date(raw);
        if (isNaN(d)) return raw;
        return d.toLocaleDateString("vi-VN", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function shippingLine(order) {
        const addr = order.shipping_address;
        if (!addr) return "";
        if (typeof addr === "string") return addr;
        const parts = [
          addr.full_name,
          addr.phone,
          addr.line1,
          addr.city,
          addr.country,
        ].filter(Boolean);
        return parts.join(", ");
      }

      async function loadOrders() {
        document.getElementById("ordersContent").innerHTML = `
            <div class="orders-empty">
                <div class="empty-icon">⏳</div>
                <h3>Đang tải đơn hàng…</h3>
            </div>`;
        try {
          const res = await fetch(
            `${API_BASE}/orders/?customer_id=${customerId}`,
          );
          const payload = await res.json();
          orders = normalizeOrders(payload);
          document.getElementById("headerOrderCount").textContent =
            orders.length;
          renderOrders();
        } catch {
          document.getElementById("ordersContent").innerHTML = `
                <div class="orders-empty">
                    <div class="empty-icon">⚠️</div>
                    <h3>Không tải được đơn hàng</h3>
                    <p>Vui lòng kiểm tra kết nối và thử lại.</p>
                </div>`;
          showNotice("Không thể kết nối API đơn hàng.", "bad");
        }
      }

      function renderOrders() {
        const status = document.getElementById("statusFilter").value;
        const filtered = status
          ? orders.filter(
              (o) => String(o.status || "").toLowerCase() === status,
            )
          : orders;
        const box = document.getElementById("ordersContent");

        document.getElementById("orderCountChip").textContent =
          filtered.length === orders.length
            ? `${orders.length} đơn`
            : `${filtered.length} / ${orders.length} đơn`;

        if (!filtered.length) {
          box.innerHTML = `
                <div class="orders-empty">
                    <div class="empty-icon">🔍</div>
                    <h3>Không có đơn hàng phù hợp</h3>
                    <p>${status ? `Bạn chưa có đơn nào ở trạng thái này.` : "Hãy mua sắm và tạo đơn hàng đầu tiên!"}</p>
                    <a class="btn-start-shop" href="/ui/customer/">🛍 Mua sắm ngay</a>
                </div>`;
          return;
        }

        box.innerHTML = filtered
          .map((order, idx) => {
            const items = order.items || [];
            const ship = shippingLine(order);
            const payStatus = order.payment_status || "n/a";
            const shipStatus =
              order.shipping_status || order.delivery_date || "—";

            return `
            <article class="order-card">
                <!-- Header -->
                <div class="order-card-header">
                    <div class="order-id-group">
                        <span class="order-id-badge">📦 Đơn #${esc(order.id)}</span>
                        <span class="order-date">${formatDate(order.created_at)}</span>
                    </div>
                    <span class="status-badge ${statusClass(order.status)}">${statusLabel(order.status)}</span>
                </div>

                <!-- Stats row -->
                <div class="order-stats-row">
                    <div class="order-stat-cell">
                        <div class="label">Tổng tiền</div>
                        <div class="value price">${money(orderTotal(order))}</div>
                    </div>
                    <div class="order-stat-cell">
                        <div class="label">Thanh toán</div>
                        <div class="value">
                            <span class="pay-chip ${payChipClass(payStatus)}">${esc(payStatus)}</span>
                        </div>
                    </div>
                    <div class="order-stat-cell">
                        <div class="label">Vận chuyển</div>
                        <div class="value">${esc(shipStatus)}</div>
                    </div>
                </div>

                <!-- Items toggle -->
                <div class="order-items-toggle" onclick="toggleItems(${idx})">
                    <div class="toggle-label">
                        🛍 Chi tiết sản phẩm
                        <span class="items-count-chip">${items.length} món</span>
                    </div>
                    <span class="toggle-arrow" id="arrow-${idx}">▼</span>
                </div>
                <div class="order-items-body" id="items-${idx}">
                    <table class="items-table">
                        <thead>
                            <tr>
                                <th>Sản phẩm</th>
                                <th>Số lượng</th>
                                <th>Đơn giá</th>
                                <th>Thành tiền</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${
                              items.length
                                ? items
                                    .map((item) => {
                                      const qty = Number(item.quantity || 1);
                                      const price = Number(
                                        item.price || item.unit_price || 0,
                                      );
                                      return `
                                <tr>
                                    <td>
                                        <div class="item-name">${esc(item.name || item.product_name || `Sản phẩm`)}</div>
                                        <div class="item-id">#${esc(item.product_id || item.id || "—")}</div>
                                    </td>
                                    <td><span class="item-qty">× ${qty}</span></td>
                                    <td class="item-price">${money(price)}</td>
                                    <td class="item-price">${money(price * qty)}</td>
                                </tr>`;
                                    })
                                    .join("")
                                : `
                                <tr>
                                    <td colspan="4" style="text-align:center;color:var(--muted);padding:20px;">
                                        Không có chi tiết sản phẩm.
                                    </td>
                                </tr>`
                            }
                        </tbody>
                    </table>
                </div>

                <!-- Footer -->
                <div class="order-card-footer">
                    ${
                      ship
                        ? `
                    <div class="ship-addr">
                        <span>📍</span>
                        <span>${esc(ship)}</span>
                    </div>`
                        : "<div></div>"
                    }
                    <button class="btn-reorder" onclick="reorder(${Number(order.id)})">
                        🔁 Mua lại
                    </button>
                </div>
            </article>`;
          })
          .join("");
      }

      function toggleItems(idx) {
        const body = document.getElementById(`items-${idx}`);
        const arrow = document.getElementById(`arrow-${idx}`);
        body.classList.toggle("open");
        arrow.classList.toggle("open");
      }

      async function reorder(orderId) {
        const order = orders.find((o) => Number(o.id) === Number(orderId));
        if (!order || !Array.isArray(order.items) || !order.items.length) {
          showNotice("Đơn hàng không có sản phẩm để mua lại.", "bad");
          return;
        }
        try {
          for (const item of order.items) {
            await fetch(`${API_BASE}/customer/cart-items/`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                customer_id: customerId,
                product_id: Number(item.product_id || item.item_id),
                quantity: Number(item.quantity || 1),
              }),
            });
          }
          showNotice("🛒 Đã thêm sản phẩm vào giỏ hàng!");
        } catch {
          showNotice("Không thể mua lại đơn này.", "bad");
        }
      }

      document
        .getElementById("statusFilter")
        .addEventListener("change", renderOrders);
      window.addEventListener("load", loadOrders);
    </script>
  </body>
</html>
