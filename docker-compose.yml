services:
  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "ktra1_user_db"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: "ktra1_product_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ktra1_product_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.24
    environment:
      NEO4J_AUTH: neo4j/12345678
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.mysql
      DB_MYSQL_NAME: ktra1_user_db
      DB_MYSQL_USER: root
      DB_MYSQL_PASSWORD: "123456"
      DB_MYSQL_HOST: mysql
      DB_MYSQL_PORT: "3306"
      JWT_SECRET_KEY: "super-secret-jwt-key-change-me"
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: "12345678"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALLOWED_HOSTS: "*"
      DB_POSTGRES_NAME: ktra1_cart_db
      DB_POSTGRES_USER: postgres
      DB_POSTGRES_PASSWORD: "123456"
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: "5432"
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8004/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_POSTGRES_NAME: ktra1_product_db
      DB_POSTGRES_USER: postgres
      DB_POSTGRES_PASSWORD: "123456"
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: "5432"
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8003/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - neo4j
      - user-service
      - product-service
    environment:
      ALLOWED_HOSTS: "*"
      AI_SERVICE_PORT: "8005"
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8003
    ports:
      - "8005:8005"

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      ship-service:
        condition: service_healthy
    environment:
      ALLOWED_HOSTS: "*"
      DB_POSTGRES_NAME: ktra1_order_db
      DB_POSTGRES_USER: postgres
      DB_POSTGRES_PASSWORD: "123456"
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: "5432"
      PAYMENT_SERVICE_URL: http://payment-service:8007
      SHIP_SERVICE_URL: http://ship-service:8008
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8006/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALLOWED_HOSTS: "*"
      DB_POSTGRES_NAME: ktra1_payment_db
      DB_POSTGRES_USER: postgres
      DB_POSTGRES_PASSWORD: "123456"
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: "5432"
    ports:
      - "8007:8007"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8007/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  ship-service:
    build:
      context: ./ship-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALLOWED_HOSTS: "*"
      DB_POSTGRES_NAME: ktra1_ship_db
      DB_POSTGRES_USER: postgres
      DB_POSTGRES_PASSWORD: "123456"
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: "5432"
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8008/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    depends_on:
      api-gateway-ui:
        condition: service_started
      user-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      ai-service:
        condition: service_started
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      ship-service:
        condition: service_healthy
    environment:
      API_GATEWAY_PORT: "8000"
    ports:
      - "8000:8000"

  api-gateway-ui:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile.ui
    expose:
      - "8010"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      ALLOWED_HOSTS: "*"
      API_GATEWAY_PORT: "8010"
      CUSTOMER_SERVICE_URL: http://user-service:8001
      STAFF_SERVICE_URL: http://user-service:8001
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8003
      CART_SERVICE_URL: http://cart-service:8004
      AI_SERVICE_URL: http://ai-service:8005
      ORDER_SERVICE_URL: http://order-service:8006
      PAYMENT_SERVICE_URL: http://payment-service:8007
      SHIP_SERVICE_URL: http://ship-service:8008

volumes:
  mysql_data:
  postgres_data:
  neo4j_data:
